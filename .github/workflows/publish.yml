name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.13"
  LOCALES_DIR: "prismer/locales"
  MESSAGE_DOMAIN: "messages"

jobs:
  validate:
    name: "Validate & Prepare"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      has-translations: ${{ steps.check-translations.outputs.has-translations }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install babel

      - name: Extract version
        id: get-version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2 || echo "0.0.0")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Check translations structure
        id: check-translations
        run: |
          if [ -d "${{ env.LOCALES_DIR }}" ]; then
            echo "✅ Translations directory found"
            echo "has-translations=true" >> $GITHUB_OUTPUT
          else
            echo "️ No translations directory"
            echo "has-translations=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate .pot file
        if: steps.check-translations.outputs.has-translations == 'true'
        run: |
          if [ -f "${{ env.LOCALES_DIR }}/messages.pot" ]; then
            echo "✅ POT file exists"
          else
            echo "⚠️ POT file not found (optional)"
          fi

  compile-translations:
    name: "Compile Translations"
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has-translations == 'true'

    strategy:
      matrix:
        locale: ${{ fromJSON('["en"]') }}
      fail-fast: false

    outputs:
      compiled-languages: ${{ steps.output-languages.outputs.languages }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Babel
        run: |
          python -m pip install --upgrade pip
          python -m pip install babel

      - name: Compile ${{ matrix.locale }} translations
        id: compile
        run: |
          echo "🔄 Compiling translations for ${{ matrix.locale }}..."
          pybabel compile \
            -d ${{ env.LOCALES_DIR }} \
            -D ${{ env.MESSAGE_DOMAIN }} \
            -l ${{ matrix.locale }} \
            --statistics

      - name: Verify .mo file
        run: |
          MO_FILE="${{ env.LOCALES_DIR }}/${{ matrix.locale }}/LC_MESSAGES/${{ env.MESSAGE_DOMAIN }}.mo"
          if [ -f "$MO_FILE" ]; then
            SIZE=$(stat -f%z "$MO_FILE" 2>/dev/null || stat -c%s "$MO_FILE")
            echo "✅ Generated: $MO_FILE ($SIZE bytes)"
          else
            echo "❌ Failed to generate: $MO_FILE"
            exit 1
          fi

      - name: Upload compiled translations
        uses: actions/upload-artifact@v4
        with:
          name: translations-${{ matrix.locale }}
          path: ${{ env.LOCALES_DIR }}/${{ matrix.locale }}/
          retention-days: 1

      - name: Output compiled language
        id: output-languages
        run: echo "languages=${{ matrix.locale }}" >> $GITHUB_OUTPUT

  build:
    name: "Build Distribution"
    runs-on: ubuntu-latest
    needs: [validate, compile-translations]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Download compiled translations
        uses: actions/download-artifact@v4
        with:
          pattern: translations-*
          path: ${{ env.LOCALES_DIR }}/
          merge-multiple: true

      - name: Verify translations structure
        run: |
          echo "📁 Translations directory:"
          find ${{ env.LOCALES_DIR }} -name "*.mo" -type f || echo "No .mo files found"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build --outdir dist/

      - name: Inspect build artifacts
        run: |
          echo "📦 Built files:"
          ls -lh dist/
          
          # Проверяем, что .mo файлы включены в wheel
          if [ -f dist/*.whl ]; then
            echo "🔍 Checking wheel contents:"
            unzip -l dist/*.whl | grep -E "\.mo$|locales" || echo "No locale files in wheel"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          retention-days: 1

  pypi-publish:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment:
      name: pypi
      url: https://pypi.org/project/prism-engine-tools/${{ needs.validate.outputs.version }}

    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          skip-existing: true

      - name: Print success message
        run: |
          echo "✅ Published ${{ needs.validate.outputs.version }} to PyPI"
          echo "🔗 https://pypi.org/project/prism-engine-tools/${{ needs.validate.outputs.version }}/"

  summary:
    name: "Build Summary"
    runs-on: ubuntu-latest
    needs: [validate, compile-translations, build, pypi-publish]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "##  Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.pypi-publish.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Translations:** ${{ needs.validate.outputs.has-translations }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.pypi-publish.result }}" == "success" ]; then
            echo "✅ **Successfully published to PyPI!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Publishing failed or skipped**" >> $GITHUB_STEP_SUMMARY
          fi